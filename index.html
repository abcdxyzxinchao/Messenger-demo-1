<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Messenger Security Pro - Nâng cấp</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* GIỮ NGUYÊN CSS CŨ VÀ THÊM CSS MỚI */
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        #chat-screen, #friend-screen { display: none; flex: 1; flex-direction: column; width: 100%; max-width: 500px; margin: auto; }
        .hidden { display: none; }
        .friend-item { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        /* Các style khác giữ nguyên như file cũ của ông */
    </style>
</head>
<body>
    <!-- Màn hình Đăng nhập (Giữ nguyên) -->
    <div id="auth-screen">...</div>

    <!-- Màn hình Chat (Đã nâng cấp) -->
    <div id="chat-screen">
        <div id="header">
            <span id="userName"></span>
            <button onclick="showFriendScreen()">Bạn bè</button>
            <img id="avatar" onclick="toggleProfile()">
        </div>
        <div id="chatList"></div>
        <div class="controls">
            <input id="msgInput" placeholder="Aa...">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <!-- Màn hình Bạn bè (Bổ sung mới) -->
    <div id="friend-screen">
        <h3>Tìm bạn qua Email</h3>
        <input id="searchEmail" placeholder="Nhập email...">
        <button onclick="findFriend()">Tìm</button>
        <div id="friend-list"></div>
        <button onclick="showChatScreen()">Quay lại Chat</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, set, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // ... (Giữ nguyên firebaseConfig của ông) ...
        const db = getDatabase(initializeApp(firebaseConfig));
        const auth = getAuth();
        window.currentChatId = null; // Biến lưu chatId hiện tại

        // NÂNG CẤP: Chuyển đổi màn hình
        window.showFriendScreen = () => {
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('friend-screen').style.display = 'flex';
        };
        window.showChatScreen = () => {
            document.getElementById('friend-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
        };

        // NÂNG CẤP: Tìm kiếm và Kết bạn
        window.findFriend = async () => {
            const email = document.getElementById("searchEmail").value;
            const q = query(ref(db, 'users'), orderByChild('email'), equalTo(email));
            const snap = await get(q);
            if(snap.exists()){
                snap.forEach(child => {
                    document.getElementById("friend-list").innerHTML = `
                        <div>${email} 
                            <button onclick="addFriend('${child.key}')">Kết bạn</button>
                        </div>`;
                });
            }
        };

        window.addFriend = (friendUid) => {
            const myUid = auth.currentUser.uid;
            // Tạo chatId chung cho 2 người
            const chatId = [myUid, friendUid].sort().join('_');
            set(ref(db, 'friends/' + myUid + '/' + friendUid), { chatId: chatId, name: 'Bạn' });
            set(ref(db, 'friends/' + friendUid + '/' + myUid), { chatId: chatId, name: 'Bạn' });
            alert("Đã kết bạn thành công!");
        };

        // NÂNG CẤP: Hàm gửi tin nhắn thông minh
        window.sendMessage = () => {
            const input = document.getElementById("msgInput");
            if (!input.value.trim()) return;
            // Nếu có currentChatId thì lưu vào nhánh chat riêng, không thì lưu public
            const path = window.currentChatId ? 'chats/' + window.currentChatId : 'messages';
            push(ref(db, path), { text: input.value, uid: auth.currentUser.uid });
            input.value = "";
        };

        // NÂNG CẤP: Hàm load tin nhắn (Tự động nhận diện chat riêng hay chung)
        function loadMessages() {
            const path = window.currentChatId ? 'chats/' + window.currentChatId : 'messages';
            onValue(ref(db, path), (snapshot) => {
                // ... (Giữ nguyên logic render cũ của ông) ...
            });
        }

        // ... (Giữ nguyên các hàm auth, upload, record cũ của ông) ...
    </script>
</body>
</html>
