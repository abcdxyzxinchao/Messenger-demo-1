<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>My Store - Admin Version</title>
</head>
<body class="bg-gray-50">

    <nav class="flex justify-between items-center p-6 bg-white shadow-sm sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-blue-600 cursor-pointer" id="nav-brand">MY STORE</h1>
        <div id="auth-nav">
            <button id="btn-show-auth" class="px-4 py-2 bg-blue-500 text-white rounded-lg">Đăng nhập</button>
        </div>
    </nav>

    <div id="app" class="p-6">
        <div id="page-home" class="grid grid-cols-1 md:grid-cols-4 gap-6"></div>

        <div id="page-wishlist" class="hidden">...</div>
        <div id="page-detail" class="hidden">...</div>
        <div id="page-auth" class="hidden">...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, updateDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBoX1FuReGf2onOHS8GlYq8jc5b5398hQU",
            authDomain: "banhang-b31dd.firebaseapp.com",
            projectId: "banhang-b31dd",
            storageBucket: "banhang-b31dd.firebasestorage.app",
            messagingSenderId: "634655097273",
            appId: "1:634655097273:web:899337e325e046eb91f668"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "ngohieu20089@gmail.com";

        // Hàm render sản phẩm
        const renderProducts = (currentUser) => {
            const container = document.getElementById('page-home');
            container.innerHTML = "";
            for(let i=1; i<=20; i++) {
                const isAdmin = currentUser?.email === ADMIN_EMAIL;
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-md border relative">
                        <div class="h-40 bg-gray-200 mb-4 rounded"></div>
                        <h3 class="font-bold" id="title-${i}">Sản phẩm ${i}</h3>
                        <p class="text-red-500 font-semibold">500.000đ</p>
                        ${isAdmin ? `<button onclick="editProduct(${i})" class="mt-2 w-full bg-yellow-500 text-white rounded">Sửa tên</button>` : ''}
                    </div>
                `;
            }
        };

        // Hàm sửa sản phẩm dành cho Admin
        window.editProduct = async (id) => {
            const newName = prompt("Nhập tên mới cho sản phẩm:");
            if (newName) {
                try {
                    // Cập nhật vào Firestore collection 'products'
                    await setDoc(doc(db, "products", String(id)), { Ten: newName }, { merge: true });
                    document.getElementById(`title-${id}`).innerText = newName;
                    alert("Đã cập nhật!");
                } catch (err) { alert(err.message); }
            }
        };

        // Logic Auth
        onAuthStateChanged(auth, (user) => {
            renderProducts(user); // Render lại để hiện/ẩn nút Sửa
            // ... (Phần logic hiển thị avatar và menu cũ của bạn)
        });

        // Khởi tạo ban đầu
        renderProducts(null);
    </script>
</body>
</html>
