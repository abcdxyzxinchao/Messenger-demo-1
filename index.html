<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Security Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        #splash { position: fixed; top:0; left:0; width:100%; height:100%; background:#121212; display:flex; justify-content:center; align-items:center; z-index:1000; }
        #auth-screen { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #chat-screen { display: none; flex: 1; flex-direction: column; width: 100%; max-width: 500px; margin: auto; }
        #header { width: 100%; padding: 10px; display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; }
        #avatar { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        #profile-menu { display: none; position: absolute; top: 60px; right: 10px; background: #222; padding: 15px; border-radius: 10px; z-index: 500; border: 1px solid #444; }
        #chatList { flex: 1; width: 100%; overflow-y: auto; padding: 10px; }
        .message-row { display: flex; margin-bottom: 10px; }
        .row-sent { justify-content: flex-end; }
        .row-received { justify-content: flex-start; }
        .bubble { padding: 10px; border-radius: 15px; max-width: 70%; word-break: break-all; }
        .sent { background: #0084ff; }
        .received { background: #333; }
        .controls { width: 100%; padding: 10px; display: flex; gap: 5px; background: #1e1e1e; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: none; }
        button { padding: 10px; border-radius: 20px; border: none; background: #0084ff; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div id="splash"><h1>Messenger Pro</h1></div>

    <div id="auth-screen">
        <h2>Messenger Login</h2>
        <input id="email" placeholder="Email" style="margin:5px; padding:10px; border-radius:20px; border:none; width:80%"><br>
        <input id="pass" type="password" placeholder="Mật khẩu" style="margin:5px; padding:10px; border-radius:20px; border:none; width:80%"><br>
        <button onclick="handleEmailAuth('login')">Đăng nhập</button>
        <button onclick="handleEmailAuth('signup')">Đăng ký</button>
        <button onclick="loginGoogle()" style="background:#db4437">Đăng nhập Google</button>
    </div>

    <div id="chat-screen">
        <div id="header">
            <span id="userName"></span>
            <img id="avatar" onclick="toggleProfile()">
        </div>
        <div id="profile-menu">
            <p id="userEmailDisplay"></p>
            <label><input type="checkbox" id="toggleEnc" checked> Mã hóa đầu cuối</label><br><br>
            <button onclick="signOut(auth)" style="background:red; width:100%">Đăng xuất</button>
        </div>
        <div id="chatList"></div>
        <div class="controls">
            <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="uploadFile(this)">
            <button onclick="document.getElementById('fileInput').click()">📷</button>
            <button id="recordBtn" onclick="toggleRecord()">🎤</button>
            <input id="msgInput" placeholder="Aa...">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMsgEHeLOUMv4DCkfpj5vsjCQC6ySNNg0",
            authDomain: "mesaenger-demo.firebaseapp.com",
            databaseURL: "https://mesaenger-demo-default-rtdb.firebaseio.com",
            projectId: "mesaenger-demo",
            storageBucket: "mesaenger-demo.firebasestorage.app",
            messagingSenderId: "1067521129086",
            appId: "1:1067521129086:web:c29e00e5a5cd84bb74362f"
        };

        const IMGBB_API_KEY = "A7c68b09464ef65e34e1b1db53d724f5";
        const IMGBB_UPLOAD_URL = "https://api.imgbb.com/1/upload";
        const secretKey = "mat-ma-bi-mat";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        window.loginGoogle = () => signInWithPopup(auth, provider);
        window.handleEmailAuth = (type) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if(type === 'login') signInWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
            else createUserWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
        };

        window.toggleProfile = () => {
            const menu = document.getElementById('profile-menu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        };

        onAuthStateChanged(auth, (user) => {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('auth-screen').style.display = user ? 'none' : 'flex';
            document.getElementById('chat-screen').style.display = user ? 'flex' : 'none';
            if(user) {
                document.getElementById('avatar').src = user.photoURL || 'https://ui-avatars.com/api/?name=' + user.email;
                document.getElementById('userName').innerText = user.displayName || user.email;
                document.getElementById('userEmailDisplay').innerText = user.email;
                loadMessages();
            }
        });

        window.sendMessage = () => {
            const input = document.getElementById("msgInput");
            if (!input.value.trim()) return;
            const useEnc = document.getElementById("toggleEnc").checked;
            const text = useEnc ? CryptoJS.AES.encrypt(input.value, secretKey).toString() : input.value;
            push(ref(db, 'messages'), { text, type: 'text', uid: auth.currentUser.uid, encrypted: useEnc });
            input.value = "";
        };

        window.uploadFile = async (input) => {
            const file = input.files[0];
            if (!file) return;
            if (file.type.startsWith('video')) {
                const path = 'videos/' + Date.now() + file.name;
                const snapshot = await uploadBytes(storageRef(storage, path), file);
                const url = await getDownloadURL(snapshot.ref);
                push(ref(db, 'messages'), { text: url, type: 'video', uid: auth.currentUser.uid });
            } else {
                const formData = new FormData();
                formData.append('image', file);
                formData.append('key', IMGBB_API_KEY);
                const response = await fetch(IMGBB_UPLOAD_URL, { method: 'POST', body: formData });
                const result = await response.json();
                if (result.success) push(ref(db, 'messages'), { text: result.data.url, type: 'image', uid: auth.currentUser.uid });
            }
        };

        let mediaRecorder, chunks = [];
        window.toggleRecord = async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.start();
                document.getElementById("recordBtn").innerText = "⏹️";
                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const path = 'audio/' + Date.now() + '.webm';
                    const snapshot = await uploadBytes(storageRef(storage, path), blob);
                    const url = await getDownloadURL(snapshot.ref);
                    push(ref(db, 'messages'), { text: url, type: 'audio', uid: auth.currentUser.uid });
                    chunks = [];
                };
            } else {
                mediaRecorder.stop();
                document.getElementById("recordBtn").innerText = "🎤";
            }
        };

        function loadMessages() {
            onValue(ref(db, 'messages'), (snapshot) => {
                const list = document.getElementById("chatList");
                list.innerHTML = "";
                snapshot.forEach((child) => {
                    const msg = child.val();
                    const isMe = msg.uid === auth.currentUser.uid;
                    let content = msg.text;
                    if (msg.type === 'text' && msg.encrypted) content = CryptoJS.AES.decrypt(msg.text, secretKey).toString(CryptoJS.enc.Utf8);
                    
                    if (msg.type === 'image') content = `<img src="${msg.text}" style="width:100%; border-radius:10px">`;
                    else if (msg.type === 'video') content = `<video src="${msg.text}" controls style="width:100%"></video>`;
                    else if (msg.type === 'audio') content = `<audio src="${msg.text}" controls></audio>`;
                    
                    list.innerHTML += `<div class="message-row ${isMe ? 'row-sent' : 'row-received'}"><div class="bubble ${isMe ? 'sent' : 'received'}">${content}</div></div>`;
                });
                list.scrollTop = list.scrollHeight;
            });
        }
    </script>
</body>
</html>
