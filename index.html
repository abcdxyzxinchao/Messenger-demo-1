<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Security Pro</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        #splash { position: fixed; top:0; left:0; width:100%; height:100%; background:#121212; display:flex; justify-content:center; align-items:center; z-index:9999; }
        #auth-screen, #chat-screen, #friend-screen { display: none; flex: 1; flex-direction: column; width: 100%; max-width: 500px; margin: auto; padding: 10px; }
        .bubble { padding: 10px; border-radius: 15px; margin: 5px; max-width: 75%; background: #333; }
        .sent { background: #0084ff; align-self: flex-end; }
        button { padding: 10px; border-radius: 20px; border: none; background: #0084ff; color: white; cursor: pointer; margin: 5px; }
        input { padding: 10px; margin: 5px; border-radius: 20px; border: none; color: #000; }
    </style>
</head>
<body>

    <div id="splash"><h1>Messenger Pro</h1></div>

    <div id="auth-screen">
        <input id="email" placeholder="Email">
        <input id="pass" type="password" placeholder="Mật khẩu">
        <button onclick="login()">Đăng nhập</button>
    </div>

    <div id="chat-screen">
        <div id="header">
            <button onclick="goScreen('friend-screen')">Bạn bè</button>
        </div>
        <div id="chatList"></div>
        <input id="msgInput" placeholder="Aa...">
        <button onclick="sendMsg()">Gửi</button>
    </div>

    <div id="friend-screen">
        <input id="searchEmail" placeholder="Email bạn bè...">
        <button onclick="findFriend()">Tìm kiếm</button>
        <div id="friend-list"></div>
        <button onclick="goScreen('chat-screen')">Quay lại Chat</button>
    </div>

    <script type="module">
        // Ẩn splash ngay lập tức để tránh treo màn hình
        document.getElementById('splash').style.display = 'none';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, set, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // Cấu hình từ image_16.png
        const firebaseConfig = { 
            apiKey: "AIzaSyBMsgEHeLOUmv4o9m6qNnJ-rP5V4",
            authDomain: "mesaenger-demo.firebaseapp.com",
            databaseURL: "https://mesaenger-demo-default-rtdb.firebaseio.com",
            projectId: "mesaenger-demo",
            storageBucket: "mesaenger-demo.appspot.com",
            messagingSenderId: "1067521129086",
            appId: "1:1067521129086:web:8e16e6f4773c242a47e5b6"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getDatabase(app);
        window.currentChatId = null;

        onAuthStateChanged(window.auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                loadMessages();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        });

        window.login = () => {
            signInWithEmailAndPassword(window.auth, document.getElementById('email').value, document.getElementById('pass').value)
            .catch(e => alert("Lỗi: " + e.message));
        };

        window.goScreen = (id) => {
            document.getElementById('chat-screen').style.display = (id === 'chat-screen') ? 'flex' : 'none';
            document.getElementById('friend-screen').style.display = (id === 'friend-screen') ? 'flex' : 'none';
        };

        window.findFriend = async () => {
            const email = document.getElementById("searchEmail").value;
            const snap = await get(query(ref(window.db, 'users'), orderByChild('email'), equalTo(email)));
            const list = document.getElementById("friend-list");
            list.innerHTML = "";
            snap.forEach(child => {
                list.innerHTML += `<div>${email} <button onclick="addFriend('${child.key}')">Kết bạn</button></div>`;
            });
        };

        window.addFriend = (friendUid) => {
            const chatId = [window.auth.currentUser.uid, friendUid].sort().join('_');
            set(ref(window.db, 'friends/' + window.auth.currentUser.uid + '/' + friendUid), { chatId });
            set(ref(window.db, 'friends/' + friendUid + '/' + window.auth.currentUser.uid), { chatId });
            alert("Đã kết bạn!");
        };

        window.sendMsg = () => {
            const input = document.getElementById("msgInput");
            if (!input.value.trim()) return;
            const path = window.currentChatId ? 'chats/' + window.currentChatId : 'messages';
            push(ref(window.db, path), { text: input.value, uid: window.auth.currentUser.uid });
            input.value = "";
        };

        function loadMessages() {
            const path = window.currentChatId ? 'chats/' + window.currentChatId : 'messages';
            onValue(ref(window.db, path), (snapshot) => {
                const list = document.getElementById("chatList");
                list.innerHTML = "";
                snapshot.forEach(child => {
                    const msg = child.val();
                    list.innerHTML += `<div class="bubble ${msg.uid === window.auth.currentUser.uid ? 'sent' : ''}">${msg.text}</div>`;
                });
            });
        }
    </script>
</body>
</html>
