<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger Pro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#121212;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:500px;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#1e1e1e;
}

header{
    background:#0084ff;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.screen{
    display:none;
    flex-direction:column;
    height:100%;
}

.active{
    display:flex;
}

.auth-box{
    margin:auto;
    width:90%;
    display:flex;
    flex-direction:column;
}

input{
    padding:12px;
    border:none;
    border-radius:12px;
    margin:6px 0;
    outline:none;
}

button{
    padding:12px;
    border:none;
    border-radius:12px;
    background:#0084ff;
    color:white;
    cursor:pointer;
    margin-top:6px;
}

button:hover{
    opacity:0.9;
}

#chatList{
    flex:1;
    overflow-y:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
}

.bubble{
    padding:10px 14px;
    border-radius:15px;
    margin:5px 0;
    max-width:75%;
    word-wrap:break-word;
    background:#333;
}

.sent{
    align-self:flex-end;
    background:#0084ff;
}

.topbar{
    display:flex;
    gap:5px;
    padding:10px;
}

.chat-input{
    display:flex;
    padding:10px;
    gap:5px;
}

.chat-input input{
    flex:1;
}

.friend-item{
    background:#2a2a2a;
    margin:5px;
    padding:10px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

img.preview{
    width:200px;
    border-radius:10px;
    margin-top:5px;
}
</style>
</head>
<body>

<div class="app">

<header>Messenger Pro 🚀</header>

<!-- AUTH -->
<div id="auth-screen" class="screen active">
    <div class="auth-box">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Mật khẩu">

        <button onclick="register()">Đăng ký</button>
        <button onclick="login()">Đăng nhập</button>
    </div>
</div>

<!-- CHAT -->
<div id="chat-screen" class="screen">

    <div class="topbar">
        <button onclick="openFriends()">Bạn bè</button>
        <button onclick="logout()">Đăng xuất</button>
    </div>

    <div id="chatList"></div>

    <div class="chat-input">
        <input type="file" id="imgFile">

        <input id="msgInput" placeholder="Nhập tin nhắn...">

        <button onclick="sendMsg()">Gửi</button>
    </div>

</div>

<!-- FRIEND -->
<div id="friend-screen" class="screen">

    <div class="topbar">
        <input id="searchEmail" placeholder="Email bạn bè...">
        <button onclick="findFriend()">Tìm</button>
    </div>

    <div id="friend-list"></div>

    <button onclick="backChat()">Quay lại</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    set,
    push,
    onValue,
    get,
    query,
    orderByChild,
    equalTo
} from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMsgEHeLOUMv4DCkfpj5vsjCQC6ySNNg0",
  authDomain: "mesaenger-demo.firebaseapp.com",
  databaseURL: "https://mesaenger-demo-default-rtdb.firebaseio.com",
  projectId: "mesaenger-demo",
  storageBucket: "mesaenger-demo.firebasestorage.app",
  messagingSenderId: "1067521129086",
  appId: "1:1067521129086:web:d0dfbc5245f6c47174362f",
  measurementId: "G-90WL6XMWM6"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getDatabase(app);

window.currentChatId = null;

function showScreen(id){

    document.querySelectorAll(".screen")
    .forEach(s => s.classList.remove("active"));

    document.getElementById(id)
    .classList.add("active");
}

onAuthStateChanged(auth, user => {

    if(user){
        showScreen("chat-screen");
        loadFriendList();
    }
    else{
        showScreen("auth-screen");
    }

});

window.register = async () => {

    try{

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const cred = await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        await set(ref(db, "users/" + cred.user.uid), {
            email: cred.user.email
        });

        alert("Đăng ký thành công ✅");

    }catch(e){
        alert(e.message);
    }

};

window.login = async () => {

    try{

        await signInWithEmailAndPassword(
            auth,
            document.getElementById("email").value,
            document.getElementById("password").value
        );

    }catch(e){
        alert(e.message);
    }

};

window.logout = () => {
    signOut(auth);
};

window.openFriends = () => {
    showScreen("friend-screen");
};

window.backChat = () => {
    showScreen("chat-screen");
};

window.findFriend = async () => {

    const email =
    document.getElementById("searchEmail").value;

    const q = query(
        ref(db, "users"),
        orderByChild("email"),
        equalTo(email)
    );

    const snap = await get(q);

    const list = document.getElementById("friend-list");

    list.innerHTML = "";

    snap.forEach(child => {

        const div = document.createElement("div");

        div.className = "friend-item";

        div.innerHTML = `
            <span>${email}</span>
            <button onclick="addFriend('${child.key}')">
                Kết bạn
            </button>
        `;

        list.appendChild(div);

    });

};

window.addFriend = async (friendUid) => {

    const uid = auth.currentUser.uid;

    const chatId = [uid, friendUid]
    .sort()
    .join("_");

    await set(
        ref(db, "friends/" + uid + "/" + friendUid),
        { chatId }
    );

    await set(
        ref(db, "friends/" + friendUid + "/" + uid),
        { chatId }
    );

    window.currentChatId = chatId;

    loadMessages();

    showScreen("chat-screen");

    alert("Đã kết bạn 🎉");

};

function loadFriendList(){

    const uid = auth.currentUser.uid;

    onValue(ref(db, "friends/" + uid), async snap => {

        const list = document.getElementById("friend-list");

        list.innerHTML = "";

        snap.forEach(async child => {

            const friendUid = child.key;

            const friendData = await get(
                ref(db, "users/" + friendUid)
            );

            const data = friendData.val();

            const div = document.createElement("div");

            div.className = "friend-item";

            div.innerHTML = `
                <span>${data.email}</span>
                <button onclick="openChat('${child.val().chatId}')">
                    Nhắn tin
                </button>
            `;

            list.appendChild(div);

        });

    });

}

window.openChat = (chatId) => {

    window.currentChatId = chatId;

    loadMessages();

    showScreen("chat-screen");

};

window.sendMsg = async () => {

    if(!window.currentChatId){
        alert("Hãy chọn bạn bè");
        return;
    }

    const input =
    document.getElementById("msgInput");

    const text = input.value.trim();

    const file =
    document.getElementById("imgFile").files[0];

    let imageUrl = "";

    if(file){

        const formData = new FormData();

        formData.append("image", file);

        const res = await fetch(
            "https://api.imgbb.com/1/upload?key=a7c68b09464ef65e34e1b1db53d724f5",
            {
                method:"POST",
                body:formData
            }
        );

        const data = await res.json();

        imageUrl = data.data.url;

    }

    if(!text && !imageUrl) return;

    await push(
        ref(db, "chats/" + window.currentChatId),
        {
            text,
            image:imageUrl,
            uid:auth.currentUser.uid,
            time:Date.now()
        }
    );

    input.value = "";

    document.getElementById("imgFile").value = "";

};

function loadMessages(){

    if(!window.currentChatId) return;

    const list =
    document.getElementById("chatList");

    onValue(
        ref(db, "chats/" + window.currentChatId),
        snap => {

            list.innerHTML = "";

            snap.forEach(child => {

                const msg = child.val();

                const div =
                document.createElement("div");

                div.className =
                    "bubble " +
                    (
                        msg.uid === auth.currentUser.uid
                        ? "sent"
                        : ""
                    );

                if(msg.text){

                    const p =
                    document.createElement("div");

                    p.textContent = msg.text;

                    div.appendChild(p);

                }

                if(msg.image){

                    const img =
                    document.createElement("img");

                    img.src = msg.image;

                    img.className = "preview";

                    div.appendChild(img);

                }

                list.appendChild(div);

            });

            list.scrollTop = list.scrollHeight;

        }
    );

}

</script>

</body>
</html>
