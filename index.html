<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Security Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        #splash { position: fixed; top:0; left:0; width:100%; height:100%; background:#121212; display:flex; justify-content:center; align-items:center; z-index:9999; }
        #auth-screen, #chat-screen, #friend-screen { display: none; flex: 1; flex-direction: column; width: 100%; max-width: 500px; margin: auto; }
        .bubble { padding: 12px; border-radius: 15px; margin: 5px; max-width: 75%; background: #333; }
        .sent { background: #0084ff; align-self: flex-end; }
        button { padding: 10px; border-radius: 20px; border: none; background: #0084ff; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div id="splash"><h1>Messenger Pro</h1></div>

    <div id="auth-screen">
        <input id="email" placeholder="Email">
        <input id="pass" type="password" placeholder="Mật khẩu">
        <button onclick="handleAuth()">Đăng nhập</button>
    </div>

    <div id="chat-screen">
        <div id="header">
            <button onclick="switchScreen('friend-screen')">Bạn bè</button>
        </div>
        <div id="chatList"></div>
        <input id="msgInput" placeholder="Aa...">
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <div id="friend-screen">
        <input id="searchEmail" placeholder="Email...">
        <button onclick="findFriend()">Tìm</button>
        <div id="friend-list"></div>
        <button onclick="switchScreen('chat-screen')">Quay lại Chat</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, set, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // DÁN CONFIG CỦA ÔNG VÀO ĐÂY
        const firebaseConfig = { /* apiKey, ... */ };
        
        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getDatabase(app);
        window.currentChatId = null;

        // TẮT SPLASH NGAY LẬP TỨC
        document.getElementById('splash').style.display = 'none';

        onAuthStateChanged(window.auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                loadMessages();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        });

        // HÀM ĐIỀU HƯỚNG
        window.switchScreen = (id) => {
            document.getElementById('chat-screen').style.display = id === 'chat-screen' ? 'flex' : 'none';
            document.getElementById('friend-screen').style.display = id === 'friend-screen' ? 'flex' : 'none';
        };

        window.handleAuth = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            signInWithEmailAndPassword(window.auth, email, pass).catch(e => alert(e.message));
        };

        window.findFriend = async () => {
            const email = document.getElementById("searchEmail").value;
            const q = query(ref(window.db, 'users'), orderByChild('email'), equalTo(email));
            const snap = await get(q);
            const list = document.getElementById("friend-list");
            list.innerHTML = "";
            snap.forEach(child => {
                list.innerHTML += `<div>${email} <button onclick="addFriend('${child.key}')">Kết bạn</button></div>`;
            });
        };

        window.addFriend = (friendUid) => {
            const myUid = window.auth.currentUser.uid;
            const chatId = [myUid, friendUid].sort().join('_');
            set(ref(window.db, 'friends/' + myUid + '/' + friendUid), { chatId });
            set(ref(window.db, 'friends/' + friendUid + '/' + myUid), { chatId });
            alert("Đã kết bạn!");
        };

        window.sendMessage = () => {
            const input = document.getElementById("msgInput");
            if (!input.value.trim()) return;
            const path = window.currentChatId ? 'chats/' + window.currentChatId : 'messages';
            push(ref(window.db, path), { text: input.value, uid: window.auth.currentUser.uid });
            input.value = "";
        };

        function loadMessages() {
            const path = window.currentChatId ? 'chats/' + window.currentChatId : 'messages';
            onValue(ref(window.db, path), (snapshot) => {
                const list = document.getElementById("chatList");
                list.innerHTML = "";
                snapshot.forEach(child => {
                    const msg = child.val();
                    const isMe = msg.uid === window.auth.currentUser.uid;
                    list.innerHTML += `<div class="bubble ${isMe ? 'sent' : ''}">${msg.text}</div>`;
                });
            });
        }
    </script>
</body>
</html>
