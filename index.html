<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Messenger Pro V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* CSS rút gọn cho gọn code */
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        #modal-profile { display: none; position: fixed; top: 50px; right: 10px; background: #222; padding: 15px; border-radius: 10px; z-index: 1000; }
        .row-sent { display: flex; justify-content: flex-end; }
        .row-received { display: flex; justify-content: flex-start; }
        .bubble { padding: 10px; margin: 5px; border-radius: 15px; max-width: 70%; background: #333; }
        .sent { background: #0084ff; }
        #chat-screen { display: none; flex: 1; flex-direction: column; }
    </style>
</head>
<body>

    <!-- Màn hình Auth -->
    <div id="auth-screen">
        <h2>Messenger</h2>
        <input id="email" placeholder="Email"><br>
        <input id="pass" type="password" placeholder="Mật khẩu"><br>
        <button onclick="handleAuth('login')">Đăng nhập</button>
        <button onclick="handleAuth('signup')">Đăng ký</button>
        <button onclick="loginGoogle()">Google</button>
    </div>

    <!-- Màn hình Chat -->
    <div id="chat-screen">
        <div id="header">
            <img id="avatar" onclick="toggleMenu()" style="width:40px; border-radius:50%">
        </div>
        
        <!-- Menu Profile ẩn/hiện -->
        <div id="modal-profile">
            <p id="userEmail"></p>
            <label><input type="checkbox" id="toggleEnc" checked> Mã hóa đầu cuối</label><br>
            <button onclick="logout()">Đăng xuất</button>
        </div>

        <div id="chatList" style="flex:1; overflow-y:auto"></div>
        <div class="controls">
            <input id="msgInput" placeholder="Aa...">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // Firebase Config... 
        // Logic Auth
        window.handleAuth = (type) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if(type === 'login') signInWithEmailAndPassword(auth, email, pass);
            else createUserWithEmailAndPassword(auth, email, pass);
        };

        window.toggleMenu = () => {
            const m = document.getElementById('modal-profile');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        };

        window.sendMessage = () => {
            const input = document.getElementById("msgInput");
            const isEncrypted = document.getElementById("toggleEnc").checked;
            let text = input.value;
            
            if(isEncrypted) text = CryptoJS.AES.encrypt(text, "mat-ma").toString();
            
            push(ref(db, 'messages'), { text, isEncrypted, uid: auth.currentUser.uid });
            input.value = "";
        };

        // Logic render tin nhắn
        // Nếu msg.isEncrypted == true thì mới gọi hàm giải mã
    </script>
</body>
</html>
