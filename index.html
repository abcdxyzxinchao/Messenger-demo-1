<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Shop Pro Full</title>
</head>
<body>

<h2 id="status">Loading...</h2>

<button onclick="loginGoogle()">Login</button>
<button onclick="logout()">Logout</button>

<hr>

<h3>ADMIN ADD PRODUCT</h3>
<input id="name" placeholder="Name">
<input id="price" placeholder="Price">
<button onclick="addProduct()">Add</button>

<hr>

<h3>PRODUCTS</h3>
<div id="products"></div>

<hr>

<h3>CART</h3>
<button onclick="checkout()">Checkout</button>
<div id="cart"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBoX1FuReGf2onOHS8GlYq8jc5b5398hQU",
  authDomain: "banhang-b31dd.firebaseapp.com",
  projectId: "banhang-b31dd",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let user = null;
let cart = [];

/* ================= AUTH ================= */
window.loginGoogle = () => signInWithRedirect(auth, provider);

getRedirectResult(auth).catch(console.error);

onAuthStateChanged(auth, async (u) => {
  user = u;
  document.getElementById("status").innerText =
    u ? "Hi: " + u.email : "Not logged in";

  if (u) {
    await createUserIfNotExists(u);
    loadCart();
  }
});

window.logout = () => signOut(auth);

/* ================= USER ================= */
async function createUserIfNotExists(u) {
  const ref = doc(db, "users", u.uid);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref, {
      email: u.email,
      role: "user"
    });
  }
}

/* ================= PRODUCTS ================= */
window.addProduct = async () => {
  if (!user) return alert("Login first");

  await addDoc(collection(db, "products"), {
    name: name.value,
    price: price.value,
    createdAt: Date.now()
  });
};

onSnapshot(collection(db, "products"), (snap) => {
  let html = "";

  snap.forEach(d => {
    let p = d.data();

    html += `
      <div style="border:1px solid #ccc;padding:10px;margin:5px">
        <b>${p.name}</b><br>
        ${p.price} đ<br>
        <button onclick="addToCart('${p.name}',${p.price})">
          Add Cart
        </button>
      </div>
    `;
  });

  products.innerHTML = html;
});

/* ================= CART ================= */
window.addToCart = (name, price) => {
  cart.push({ name, price });
  renderCart();
};

function renderCart() {
  let total = 0;
  let html = "";

  cart.forEach(i => {
    html += `${i.name} - ${i.price}<br>`;
    total += Number(i.price);
  });

  html += "<hr>Total: " + total;
  cartDiv.innerHTML = html;
}

/* ================= CHECKOUT ================= */
window.checkout = async () => {
  if (!user) return;

  await addDoc(collection(db, "orders"), {
    uid: user.uid,
    items: cart,
    total: cart.reduce((s,i)=>s+Number(i.price),0),
    status: "pending",
    createdAt: Date.now()
  });

  cart = [];
  renderCart();
  alert("Order placed");
};

function loadCart() {
  renderCart();
}

</script>

<div id="products"></div>
<div id="cartDiv"></div>

</body>
</html>
